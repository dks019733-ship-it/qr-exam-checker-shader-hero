name: Guardian PR checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/system-guardian-line]

permissions:
  contents: read

concurrency:
  group: guardian-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qr_exam_checker?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qr_exam_checker?schema=public
      AUTH_SECRET: ci-only-placeholder-secret
      AUTH_GOOGLE_ID: ci-placeholder
      AUTH_GOOGLE_SECRET: ci-placeholder
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SYSTEM_OWNER_EMAIL: owner@example.com
      CRON_SECRET: ci-only-placeholder-cron-secret
      LINE_CHANNEL_ACCESS_TOKEN: ci-placeholder
      LINE_CHANNEL_SECRET: ci-placeholder
      LINE_OWNER_USER_ID: U00000000000000000000000000000000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
